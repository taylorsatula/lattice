[package]
name = "lattice-crypto"
version = "0.0.0"
description = "Lattice cryptography: Ed25519, X25519, X-Wing, ChaCha20-Poly1305, BLAKE3, key events"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
getrandom = "0.4"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
subtle = "2.6"
x-wing = { version = "0.1", features = ["getrandom"] }
x25519-dalek = "3"
zeroize = "1.9"

[dev-dependencies]
x-wing = { version = "0.1", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
