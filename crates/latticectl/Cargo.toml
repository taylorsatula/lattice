[package]
name = "latticectl"
version = "0.0.0"
description = "Lattice admin CLI over the owner-only socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "latticectl"
path = "src/main.rs"

[dependencies]
lattice-client = { version = "0.0.0", path = "../lattice-client" }
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true
