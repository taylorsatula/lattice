[package]
name = "latticed"
version = "0.0.0"
description = "Lattice daemon: config, wiring, local API sockets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lattice-core = { version = "0.0.0", path = "../lattice-core" }
lattice-crypto = { version = "0.0.0", path = "../lattice-crypto" }
lattice-net = { version = "0.0.0", path = "../lattice-net" }
lattice-proto = { version = "0.0.0", path = "../lattice-proto" }
lattice-store = { version = "0.0.0", path = "../lattice-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
lattice-client = { version = "0.0.0", path = "../lattice-client" }
tempfile = "3"
