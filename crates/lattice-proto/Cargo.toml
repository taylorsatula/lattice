[package]
name = "lattice-proto"
version = "0.0.0"
description = "Lattice wire objects: deterministic CBOR, spec objects, validation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lattice-types = { version = "0.0.0", path = "../lattice-types" }
lattice-crypto = { version = "0.0.0", path = "../lattice-crypto" }
base32ct = { version = "0.3", default-features = false, features = ["alloc"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
