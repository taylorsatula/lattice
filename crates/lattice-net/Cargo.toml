[package]
name = "lattice-net"
version = "0.0.0"
description = "Lattice transport: Noise inside WebSocket, cookies, listener, status"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lattice-proto = { version = "0.0.0", path = "../lattice-proto" }
lattice-core = { version = "0.0.0", path = "../lattice-core" }
lattice-crypto = { version = "0.0.0", path = "../lattice-crypto" }
lattice-store = { version = "0.0.0", path = "../lattice-store" }
base32ct = { version = "0.3", features = ["alloc"] }
blake2 = "0.11"
blake3 = "1.8"
futures-util = "0.3"
snow = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
