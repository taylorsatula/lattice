[package]
name = "lattice-client"
version = "0.0.0"
description = "Lattice client for the local API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lattice-types = { version = "0.0.0", path = "../lattice-types" }
lattice-proto = { version = "0.0.0", path = "../lattice-proto" }
tokio = { version = "1", features = ["io-util", "net", "io-std", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
