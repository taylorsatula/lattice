# Lattice v1 public-edge Nginx configuration.
#
# This configuration exposes only the three public federation routes and
# proxies them to the Lattice daemon bound on 127.0.0.1:1113. Administrative
# and health endpoints are reachable only from the loopback interface.
#
# Include this server block in your Nginx configuration after replacing
# example.com and the SSL certificate paths.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/ssl/certs/example.com.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Connection and read deadlines.
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 60s;
    send_timeout 30s;

    # Public federation endpoints.

    location = /.well-known/lattice {
        limit_except GET { deny all; }
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:1113/.well-known/lattice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /lattice/v1/gossip {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:1113/lattice/v1/gossip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /lattice/v1/messages {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:1113/lattice/v1/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Local/admin and health endpoints: loopback only.

    location ^~ /lattice/v1/admin/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:1113;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /lattice/v1/health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:1113;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Reject everything else explicitly.
    location / {
        return 404;
    }
}

# Optional: redirect HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$server_name$request_uri;
}
