# Runtime and state directories for latticed.
# /run/lattice holds the unix sockets; group lattice may traverse and
# connect to the app socket (0660) but not the admin socket (0600).
# /var/lib/lattice holds the identity; the daemon runs as lattice and the
# seed files are 0600, so group access to the directory alone grants nothing.
d /run/lattice 0770 lattice lattice -
d /var/lib/lattice 0750 lattice lattice -
