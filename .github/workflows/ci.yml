name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --doc --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check --workspace --all-targets --locked

  # Unsafe code is forbidden by [workspace.lints.rust] unsafe_code = "forbid"
  # in the root Cargo.toml, which only applies to crates that opt in with
  # [lints] workspace = true. Verify every crate opts in.
  no-unsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every crate opts into workspace lints
        run: |
          failed=0
          for f in crates/*/Cargo.toml; do
            if ! grep -q '^\[lints\]' "$f" || ! grep -q 'workspace = true' "$f"; then
              echo "$f does not opt into [workspace.lints]"
              failed=1
            fi
          done
          exit $failed

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  geiger:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: geiger report (all crates)
        run: |
          for d in crates/*/; do
            echo "== $d"
            (cd "$d" && cargo geiger) || true
          done

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: build fuzz targets
        run: cargo +nightly fuzz build
      - name: smoke-run fuzz targets (45s each)
        run: |
          set -e
          for target in cbor_decode frame_decode message_open message_parse record_parse parse_init local_deframe decode_kel; do
            echo "== $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=45 -timeout=25
          done
