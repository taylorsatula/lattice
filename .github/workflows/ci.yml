name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check --workspace --all-targets --locked

  no-unsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every crate root forbids unsafe_code
        run: |
          missing=$(find crates -name 'lib.rs' -o -name 'main.rs' | xargs grep -L 'forbid(unsafe_code)')
          if [ -n "$missing" ]; then echo "missing #![forbid(unsafe_code)]:"; echo "$missing"; exit 1; fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  geiger:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: geiger report (all crates)
        run: |
          for d in crates/*/; do
            echo "== $d"
            (cd "$d" && cargo geiger) || true
          done
